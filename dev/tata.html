<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tata model check</title>
<style>html, body { margin: 0; background: #fff; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<script type="module">
// Turnaround check for js/tata.js against the character sheet: ?yaw=0|90|180 · window.TV.shot(yaw, mode) → PNG data URL
// Orthographic camera framed on the model's 2.05-unit height, white background, the game's light set.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Tata } from '../js/tata.js';
const W = 420, H = 700;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(parseFloat(new URLSearchParams(location.search).get('dpr') || '1')); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 0.96;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xffffff, 0xf0e0d0, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e8, 1.9); sun.position.set(-2, 6, 8); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(4, 2, 5); scene.add(fill);
const half = 2.25 / 2, cam = new THREE.OrthographicCamera(-half * W / H, half * W / H, half, -half, 0.1, 50);
cam.position.set(0, 1.04, 10); cam.lookAt(0, 1.04, 0);
const t = new Tata(scene);
function shot(yawDeg = 0, mode = 'pose', vx = 0, phase = 0, vy = 0, grounded = true) {
  t.phase = phase; t.air = grounded ? 0 : 1;
  for (let i = 0; i < 3; i++) t.update(1 / 60, { vx, vy, grounded, facing: 1, max: 7.2, mode, yaw: yawDeg * Math.PI / 180 });
  if (mode !== 'pose') t.root.rotation.y = yawDeg * Math.PI / 180;
  r.render(scene, cam);
  return r.domElement.toDataURL('image/png');
}
const q = new URLSearchParams(location.search);
if (q.get('outfit')) t.setOutfit(Object.fromEntries(q.get('outfit').split(',').map(k => [k, true])));
shot(parseFloat(q.get('yaw') || '0'));
function view(cy = 1.04, h = 2.25) {
  const hh = h / 2; Object.assign(cam, { left: -hh * W / H, right: hh * W / H, top: hh, bottom: -hh }); cam.updateProjectionMatrix();
  cam.position.set(0, cy, 10); cam.lookAt(0, cy, 0);
}
window.TV = { shot, t, view };
</script>
</body>
</html>
