<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Phonics Run</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
<div id="app" data-screen="title">
  <!-- ribbon tails + folds (Toy Catch's result ribbon: a swallowtail with rounded corners, a fold under the band) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="rbTail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f97aa6"/><stop offset=".22" stop-color="#ef5288"/><stop offset=".6" stop-color="#df396f"/><stop offset="1" stop-color="#c2255a"/></linearGradient>
    <linearGradient id="rbFold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e1240"/><stop offset="1" stop-color="#b01d50"/></linearGradient>
    <linearGradient id="rbTailG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4bdd8"/><stop offset=".22" stop-color="#ada5c6"/><stop offset=".6" stop-color="#958cb2"/><stop offset="1" stop-color="#7d749c"/></linearGradient>
    <linearGradient id="rbFoldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f4870"/><stop offset="1" stop-color="#635a84"/></linearGradient>
  </defs></svg>
  <div id="stage3d"></div>
  <div id="flash"></div>

  <!-- HUD (play) -->
  <div class="hud">
    <div class="pill hearts" id="hearts" aria-label="Hearts"></div>
    <div class="pill slots" id="slots" aria-label="Words"></div>
    <div class="pill coins" aria-label="Coins"><i class="coin-ic"><b>m</b></i><b id="coins">0</b></div>
  </div>

  <!-- sound · exit -->
  <div class="sys">
    <button class="lang-tog" id="btnLang" data-l="en" aria-label="Voice language: English or Korean" aria-pressed="false"><span class="knob"></span><span class="flag on" data-l="en"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="flag-en"><circle cx="12" cy="12" r="12"/></clipPath></defs><g clip-path="url(#flag-en)"><rect width="24" height="24" fill="#fff"/><rect y="0" width="24" height="1.85" fill="#b22234"/><rect y="3.69" width="24" height="1.85" fill="#b22234"/><rect y="7.38" width="24" height="1.85" fill="#b22234"/><rect y="11.08" width="24" height="1.85" fill="#b22234"/><rect y="14.77" width="24" height="1.85" fill="#b22234"/><rect y="18.46" width="24" height="1.85" fill="#b22234"/><rect y="22.15" width="24" height="1.85" fill="#b22234"/><rect width="12" height="12.92" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.8" r=".7"/><circle cx="4.5" cy="1.8" r=".7"/><circle cx="7.4" cy="1.8" r=".7"/><circle cx="10.3" cy="1.8" r=".7"/><circle cx="3.05" cy="3.7" r=".7"/><circle cx="5.95" cy="3.7" r=".7"/><circle cx="8.85" cy="3.7" r=".7"/><circle cx="1.6" cy="5.6" r=".7"/><circle cx="4.5" cy="5.6" r=".7"/><circle cx="7.4" cy="5.6" r=".7"/><circle cx="10.3" cy="5.6" r=".7"/><circle cx="3.05" cy="7.5" r=".7"/><circle cx="5.95" cy="7.5" r=".7"/><circle cx="8.85" cy="7.5" r=".7"/><circle cx="1.6" cy="9.4" r=".7"/><circle cx="4.5" cy="9.4" r=".7"/><circle cx="7.4" cy="9.4" r=".7"/><circle cx="10.3" cy="9.4" r=".7"/><circle cx="3.05" cy="11.3" r=".7"/><circle cx="5.95" cy="11.3" r=".7"/><circle cx="8.85" cy="11.3" r=".7"/></g></g></svg></span><span class="flag" data-l="ko"><svg viewBox="-12 -12 24 24" aria-hidden="true"><defs><clipPath id="flag-ko"><circle r="12"/></clipPath></defs><g clip-path="url(#flag-ko)"><rect x="-18" y="-12" width="36" height="24" fill="#fff"/><g transform="rotate(33.69)"><path d="M-6 0a6 6 0 0 1 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#cd2e3a"/><path d="M-6 0a6 6 0 0 0 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#0047a0"/></g><g fill="#151515"><g transform="rotate(33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="5.6"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g><g transform="rotate(33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="2.5"/><rect x="-.75" y=".3" width=".9" height="2.5"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="5.6"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="2.5"/><rect x="-.15" y=".3" width=".9" height="2.5"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g></g></g></svg></span></button>
    <button class="sysbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/><g class="on"><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g></svg></button>
    <button class="sysbtn" id="btnExit" aria-label="Exit"><svg viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <!-- title, top left: phonics-api key (a teacher enters it once per device; dot mint = the company server judges) · SHOP · wallet -->
  <div class="sys sys-left">
    <button class="sysbtn key" id="btnKey" aria-label="Speech server key" data-api="unknown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H20.5M17.6 12v3.2M20.5 12v2.4"/></svg><i class="dot"></i></button>
    <button class="sysbtn shopbtn" id="btnShop" aria-label="Dress up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.2a1.9 1.9 0 1 1 1.9-1.9c0 1-.8 1.5-1.9 2.1v1.4l8.3 5.4a1.2 1.2 0 0 1-.7 2.2H4.4a1.2 1.2 0 0 1-.7-2.2L12 8.8"/></svg></button>
    <div class="pill wallet-pill" aria-label="Coins"><i class="coin-ic"><b>m</b></i><b id="walletTitle">0</b></div>
  </div>

  <!-- the gate's say-it turn: the picture + word, listen again, the mic, JUMP (skip this word) and one dot per word -->
  <div class="say" id="say">
    <div class="say-card">
      <img id="sayImg" alt="" />
      <div class="say-word" id="sayWord"></div>
    </div>
    <div class="say-row">
      <button class="sbtn listen" id="sayListen" aria-label="Listen"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="smic" id="sayMic" aria-label="Say it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></div>
      <button class="sbtn jumpw" id="sayJump" aria-label="Jump"></button>
    </div>
    <div class="say-dots" id="sayDots"></div>
  </div>

  <!-- touch controls -->
  <!-- side view: ← → (the first version's buttons) -->
  <div class="pad">
    <button class="pbtn" id="bLeft" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pbtn" id="bRight" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <!-- the stick (the video's left pad): drag the knob; arrows show the four ways -->
  <div class="joy" id="joy" aria-label="Move"><i class="ar u"></i><i class="ar d"></i><i class="ar l"></i><i class="ar r"></i><div class="knob" id="knob"></div></div>
  <button class="pbtn jbtn" id="bJump" aria-label="Jump up"><svg viewBox="0 0 24 24"><path d="M6 13.5l6-6 6 6M6 19l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="hand" id="hand" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M25 30V10.5a4.5 4.5 0 0 1 9 0V27l2-.6a4.4 4.4 0 0 1 5.4 3l.2.7 1.6-.4a4.3 4.3 0 0 1 5.2 3l.2.8 1-.2a4.2 4.2 0 0 1 5 3.6l.9 8.3A14 14 0 0 1 41.6 60H35a14 14 0 0 1-11.2-5.6l-9.3-12.6a4.5 4.5 0 0 1 6.9-5.8L25 39z" fill="#fff" stroke="#4a2a7a" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
  <button class="skip" id="skip">SKIP</button>

  <div id="pops"></div>
  <div class="lockhint" id="lockHint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="lockSlots"></span></div>

  <!-- title -->
  <section class="screen s-title">
    <img class="logo-img" src="assets/img/logo.png" alt="Phonics Run" draggable="false">   <!-- the user's logo (2026-11-23) -->
    <div class="tbar"><div class="levels" id="levels"></div>
    <button class="bigbtn" id="btnStart"><span>START</span></button>
      <!-- two versions: Tata seen from behind running into the picture / from the side running to the right -->
      <div class="view-tog" id="viewTog" role="group" aria-label="View">
        <button data-v="back" aria-label="Run from behind"><svg viewBox="0 0 48 32"><path d="M8 30 L20 6 H28 L40 30Z" fill="#f3c98a"/><path d="M22 6h4l1.6 24h-7.2z" fill="#fff" opacity=".7"/><circle cx="24" cy="19" r="4.4" fill="#ff6f12"/><rect x="20.2" y="22" width="7.6" height="5.4" rx="2" fill="#1c2249"/><circle cx="21.6" cy="28.6" r="1.6" fill="#08979c"/><circle cx="26.4" cy="28.6" r="1.6" fill="#08979c"/></svg></button>
        <button data-v="side" aria-label="Run from the side"><svg viewBox="0 0 48 32"><rect x="2" y="23" width="44" height="7" rx="2" fill="#6bcb4c"/><rect x="2" y="26" width="44" height="4" rx="1" fill="#c68650"/><circle cx="20" cy="13" r="4.6" fill="#ff6f12"/><circle cx="22.6" cy="12.4" r="1.2" fill="#fff"/><rect x="16.4" y="16.4" width="7" height="5" rx="2" fill="#1c2249"/><circle cx="17.6" cy="22.4" r="1.6" fill="#08979c"/><circle cx="23" cy="22.4" r="1.6" fill="#08979c"/><path d="M31 15h9M36 11l4 4-4 4" fill="none" stroke="#7c4dff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </section>

  <!-- dress room (Phonics Match's model): a window on the left shows the real 3D Tata (drag to turn her all the way
       round), the item cards on the right: price · hanger (owned) · check (worn); one item per body part -->
  <section class="screen s-shop">
    <div class="dress">
      <div class="d-win" id="dWin"><div class="d-rot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5a7.5 4 0 0 0 15 0"/><path d="M19.5 11.5a7.5 4 0 0 0-15 0"/><path d="M7 16.4l-2.5.1.6-2.4"/><path d="M17 7.6l2.5-.1-.6 2.4"/></svg><b>360°</b></div></div>
      <div class="d-side">
        <div class="d-head"><h2 class="d-title">Dress Up</h2><div class="pill d-coins"><i class="coin-ic"><b>m</b></i><b id="wallet">0</b></div></div>
        <div class="d-grid" id="items"></div>
      </div>
    </div>
    <button class="d-close" id="shopClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
  </section>

  <!-- level clear -->
  <section class="screen s-clear">
    <div class="card">
      <div class="ribbon"><i class="rb-tail l"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true"><path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTail)" stroke="url(#rbTail)" stroke-width="8" stroke-linejoin="round"/><path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFold)"/></svg></i><i class="rb-tail r"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true"><path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTail)" stroke="url(#rbTail)" stroke-width="8" stroke-linejoin="round"/><path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFold)"/></svg></i><span class="rb-band">LEVEL CLEAR!</span></div>
      <div class="stars" id="stars"></div>
      <div class="got" id="gotList"></div>
      <div class="coinline"><i class="coin-ic"><b>m</b></i><b id="coinsEnd">0</b></div>
      <div class="btns">
        <button class="rbtn" id="cHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="rbtn dressbtn" id="cDress" aria-label="Dress up"><svg viewBox="0 0 24 24"><path d="M12 7.2a1.9 1.9 0 1 1 1.9-1.9c0 1-.8 1.5-1.9 2.1v1.4l8.3 5.4a1.2 1.2 0 0 1-.7 2.2H4.4a1.2 1.2 0 0 1-.7-2.2L12 8.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="rbtn" id="cAgain" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="rbtn go" id="cNext" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </section>

  <!-- out of hearts -->
  <section class="screen s-over">
    <div class="card">
      <div class="ribbon grey"><i class="rb-tail l"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true"><path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTailG)" stroke="url(#rbTailG)" stroke-width="8" stroke-linejoin="round"/><path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFoldG)"/></svg></i><i class="rb-tail r"><svg viewBox="0 0 95 130" preserveAspectRatio="none" aria-hidden="true"><path d="M95 32 L5 32 L31 77 L5 122 L95 122 Z" fill="url(#rbTailG)" stroke="url(#rbTailG)" stroke-width="8" stroke-linejoin="round"/><path d="M75 96 L95 96 L95 123 L75 99.5 Z" fill="url(#rbFoldG)"/></svg></i><span class="rb-band">OOPS!</span></div>
      <div class="bigheart"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <div class="btns">
        <button class="rbtn" id="oHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="rbtn go" id="oAgain" aria-label="Try again"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </section>
</div>
<!-- phones held upright: turn me sideways (shown only on a portrait phone, css/style.css) -->
<div class="rotate-hint" aria-hidden="true">
  <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><g class="rh-dev"><rect x="40" y="22" width="40" height="76" rx="9"/><path d="M54 31h12"/></g><path d="M68.7 10.8A50 50 0 0 1 107 42.9M110.1 31.3 107 42.9l-9.8-6.9"/></svg>
  <p>Turn your phone sideways</p>
</div>
<script src="js/phonics-progress.js"></script>
<script src="js/phonics-api.js"></script>
<script src="js/mic.js"></script>
<script src="js/stt.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
